<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Minuta</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/design-system.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="ambient"></div>
  <div class="auth-wrap card">
    <a class="brand-mark" href="/"><span class="brand-glyph"></span> Minuta</a>
    <h1>Reset password</h1>
    <form class="form-stack" id="reset-form">
      <label class="field"><span>Reset token</span><input name="token" id="token" required /></label>
      <label class="field"><span>New password</span><input type="password" name="password" required minlength="8" /></label>
      <label class="field"><span>Confirm password</span><input type="password" name="confirm_password" required minlength="8" /></label>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
  </div>
  <script type="module">
    import { api, toast } from "/static/js/api.js";
    const params = new URLSearchParams(location.search);
    if (params.get("token")) document.getElementById("token").value = params.get("token");
    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api("/api/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({
            token: fd.get("token"),
            password: fd.get("password"),
            confirm_password: fd.get("confirm_password"),
          }),
        });
        toast("Password updated", "ok");
        location.href = "/login";
      } catch (err) {
        toast(err.message, "error");
      }
    });
  </script>
</body>
</html>
