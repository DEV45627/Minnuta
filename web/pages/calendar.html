<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — Minuta Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/design-system.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <style>
    .cal-layout { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; }
    @media (max-width: 950px) { .cal-layout { grid-template-columns: 1fr; } }

    .cal-header-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;
    }
    .cal-nav-btns { display: flex; align-items: center; gap: 0.5rem; }

    .cal-grid-card {
      background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r-xl);
      padding: 1.25rem; overflow: hidden;
    }

    .cal-days-header {
      display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
      font-size: 0.75rem; font-weight: 700; color: var(--t3); letter-spacing: 0.05em;
      text-transform: uppercase; padding-bottom: 0.75rem; border-bottom: 1px solid var(--b0);
    }

    .cal-month-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
      background: var(--b0); margin-top: 1px; border-radius: 0 0 var(--r-md) var(--r-md);
      overflow: hidden;
    }

    .cal-day-cell {
      background: var(--s1); min-height: 95px; padding: 0.5rem;
      display: flex; flex-direction: column; transition: background var(--t-fast);
      cursor: pointer; position: relative;
    }
    .cal-day-cell:hover { background: var(--s2); }
    .cal-day-cell.other-month { opacity: 0.35; background: var(--s0); }
    .cal-day-cell.is-today { background: rgba(16,185,129,0.06); }
    .cal-day-cell.is-today .day-num {
      color: #000; background: var(--accent); width: 22px; height: 22px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 800;
    }

    .day-num { font-size: 0.8125rem; font-weight: 600; color: var(--t2); margin-bottom: 0.35rem; }
    .day-events { display: grid; gap: 0.25rem; }
    .cal-event-pill {
      background: var(--accent-light); border: 1px solid var(--accent-border);
      color: var(--accent); font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.4rem;
      border-radius: var(--r-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .side-panel {
      background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r-xl);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem;
    }
    .side-panel h3 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--t1); }
    .side-events-list { display: grid; gap: 0.75rem; }
    .side-event-card {
      background: var(--s2); border: 1px solid var(--b0); border-radius: var(--r-lg);
      padding: 1rem; display: grid; gap: 0.5rem;
    }
    .side-event-card h4 { margin: 0; font-size: 0.9rem; font-weight: 700; color: var(--t1); }
    .side-event-meta { font-size: 0.78rem; color: var(--t3); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { requireAuth, api, formatWhen, toast } from "/static/js/api.js";
    import { mountShell } from "/static/js/shell.js";
    if (!requireAuth()) throw new Error("auth");

    const content = mountShell({ title: "Calendar", active: "/calendar" });
    let currentDate = new Date();
    let selectedDateStr = new Date().toISOString().split("T")[0];
    let allMeetings = [];

    content.innerHTML = `
      <div class="page-header" style="padding-bottom:1rem">
        <div>
          <h1>Schedule &amp; Calendar</h1>
          <p class="sub">Manage upcoming sessions and view chronological meeting history.</p>
        </div>
        <div class="page-header-actions">
          <a class="btn btn-primary" href="/meetings/create">+ Schedule Meeting</a>
        </div>
      </div>

      <div class="body-pad">
        <div class="cal-header-bar">
          <h2 id="cal-month-label" style="margin:0;font-size:1.3rem;font-weight:800">October 2026</h2>
          <div class="cal-nav-btns">
            <button class="btn btn-secondary btn-sm" id="btn-prev">&lt; Prev</button>
            <button class="btn btn-secondary btn-sm" id="btn-today">Today</button>
            <button class="btn btn-secondary btn-sm" id="btn-next">Next &gt;</button>
          </div>
        </div>

        <div class="cal-layout">
          <!-- Calendar Grid Card -->
          <div class="cal-grid-card">
            <div class="cal-days-header">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="cal-month-grid" id="cal-grid"></div>
          </div>

          <!-- Selected Day Side Drawer -->
          <div class="side-panel">
            <div>
              <h3 id="side-date-title">Selected Date</h3>
              <p style="font-size:0.8125rem;color:var(--t3);margin:0.25rem 0 0" id="side-date-sub">Scheduled sessions</p>
            </div>

            <div class="side-events-list" id="side-events">
              <div style="color:var(--t3);font-size:0.85rem">Select a date to view meetings.</div>
            </div>
          </div>
        </div>
      </div>
    `;

    async function initCalendar() {
      try {
        allMeetings = await api("/api/meetings");
        renderGrid();
        renderSidePanel(selectedDateStr);
      } catch (err) {
        toast(err.message, "error");
      }
    }

    function renderGrid() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById("cal-month-label").textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevDays = new Date(year, month, 0).getDate();

      const gridEl = document.getElementById("cal-grid");
      let html = "";
      const todayStr = new Date().toISOString().split("T")[0];

      // Previous month padding
      for (let i = firstDay - 1; i >= 0; i--) {
        const day = prevDays - i;
        html += `<div class="cal-day-cell other-month"><span class="day-num">${day}</span></div>`;
      }

      // Current month days
      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const isToday = dStr === todayStr;

        // Find meetings for this day
        const dayMeetings = allMeetings.filter(m => {
          const mDate = (m.scheduled_start || m.created_at || "").split("T")[0];
          return mDate === dStr;
        });

        html += `
          <div class="cal-day-cell ${isToday ? 'is-today' : ''}" data-date="${dStr}">
            <span class="day-num">${day}</span>
            <div class="day-events">
              ${dayMeetings.map(m => `<div class="cal-event-pill">${m.title}</div>`).join("")}
            </div>
          </div>
        `;
      }

      gridEl.innerHTML = html;
    }

    function renderSidePanel(dateStr) {
      document.getElementById("side-date-title").textContent = dateStr;
      const dayMeetings = allMeetings.filter(m => {
        const mDate = (m.scheduled_start || m.created_at || "").split("T")[0];
        return mDate === dateStr;
      });

      const sideEl = document.getElementById("side-events");
      if (!dayMeetings.length) {
        sideEl.innerHTML = `
          <div style="color:var(--t3);font-size:0.85rem;text-align:center;padding:1.5rem 0">
            No meetings scheduled for this date.
          </div>
          <a class="btn btn-secondary btn-sm" href="/meetings/create" style="width:100%">+ Schedule Session</a>
        `;
        return;
      }

      sideEl.innerHTML = dayMeetings.map(m => `
        <div class="side-event-card">
          <h4>${m.title}</h4>
          <div class="side-event-meta">
            ⏱ ${m.duration_minutes || 30} mins · <span class="badge ${m.status}">${m.status}</span>
          </div>
          <div style="display:flex;gap:0.5rem;margin-top:0.35rem">
            <a class="btn btn-secondary btn-sm" style="flex:1" href="/meetings/${m.public_id}">Details</a>
            <a class="btn btn-primary btn-sm" style="flex:1" href="/meeting/${m.public_id}">Join →</a>
          </div>
        </div>
      `).join("");
    }

    // Grid Day Click Listener
    document.getElementById("cal-grid").addEventListener("click", (e) => {
      const cell = e.target.closest(".cal-day-cell[data-date]");
      if (!cell) return;
      selectedDateStr = cell.dataset.date;
      renderSidePanel(selectedDateStr);
    });

    // Month Navigation
    document.getElementById("btn-prev").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderGrid();
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderGrid();
    });

    document.getElementById("btn-today").addEventListener("click", () => {
      currentDate = new Date();
      selectedDateStr = currentDate.toISOString().split("T")[0];
      renderGrid();
      renderSidePanel(selectedDateStr);
    });

    initCalendar();
  </script>
</body>
</html>
