<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Minuta</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/design-system.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="ambient"></div>
  <div class="auth-wrap card">
    <a class="brand-mark" href="/"><span class="brand-glyph"></span> Minuta</a>
    <h1>Forgot password</h1>
    <p class="muted">We'll create a reset token for local demo use.</p>
    <form class="form-stack" id="forgot-form">
      <label class="field"><span>Email</span><input type="email" name="email" required /></label>
      <button class="btn btn-primary" type="submit">Send reset link</button>
      <p class="muted" id="result"></p>
      <p class="muted"><a href="/login">Back to login</a></p>
    </form>
  </div>
  <script type="module">
    import { api, toast } from "/static/js/api.js";
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = new FormData(e.target).get("email");
      try {
        const data = await api("/api/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({ email }),
        });
        const el = document.getElementById("result");
        if (data.reset_token) {
          el.innerHTML = `Demo reset token: <code>${data.reset_token}</code><br><a href="/reset-password?token=${encodeURIComponent(data.reset_token)}">Continue to reset</a>`;
        } else {
          el.textContent = data.message;
        }
        toast("Request submitted", "ok");
      } catch (err) {
        toast(err.message, "error");
      }
    });
  </script>
</body>
</html>
